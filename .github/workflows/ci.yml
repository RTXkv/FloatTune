name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend (dist needed by tauri codegen)
        run: npx vite build

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --features custom-protocol

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --features custom-protocol

      - name: clippy (warnings fail)
        working-directory: src-tauri
        run: cargo clippy --features custom-protocol -- -D warnings

      - name: Build NSIS installer
        working-directory: .
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: floatune-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
